<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aadish's Live Music Player 🎧</title>
  <link rel="icon" href="https://fav.farm/🎧" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #07070c;
      --card-bg: rgba(18, 18, 28, 0.82);
      --card-border: rgba(255, 255, 255, 0.12);
      --primary: #58a6ff;
      --primary-glow: rgba(88, 166, 255, 0.45);
      --yt-red: #ff0000;
      --green: #3fb950;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient dynamic blurred backdrop */
    .backdrop-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(88, 166, 255, 0.18) 0%, rgba(139, 92, 246, 0.12) 45%, transparent 70%);
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Top profile bar */
    .top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-muted);
    }

    .profile-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      transition: opacity 0.2s, transform 0.2s;
    }

    .profile-link:hover {
      opacity: 0.85;
      transform: translateX(-2px);
    }

    .pixel-tag {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: #8b949e;
      background: rgba(255, 255, 255, 0.06);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Music Player Card */
    .player-card {
      width: 100%;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 28px;
      padding: 28px 24px;
      backdrop-filter: blur(24px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), 0 0 40px rgba(88, 166, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 22px;
      position: relative;
      overflow: hidden;
    }

    /* Card ambient header */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(63, 185, 80, 0.15);
      color: var(--green);
      border: 1px solid rgba(63, 185, 80, 0.35);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: livePulse 1.4s ease-in-out infinite alternate;
    }

    @keyframes livePulse {
      0% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.15); }
    }

    /* Album Art & Title Row */
    .track-info-row {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .artwork-wrap {
      position: relative;
      width: 120px;
      height: 120px;
      flex-shrink: 0;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 0 1.5px rgba(255, 255, 255, 0.18);
    }

    .artwork-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .playing .artwork-img {
      transform: scale(1.05);
    }

    .track-meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .track-title {
      font-size: 19px;
      font-weight: 800;
      line-height: 1.35;
      color: #ffffff;
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .track-artist {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Animated audio equalizer */
    .equalizer-bar-group {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
      margin-top: 4px;
    }

    .eq-bar {
      width: 3px;
      background: var(--green);
      border-radius: 2px;
      height: 4px;
      transition: height 0.15s ease;
    }

    .playing .eq-bar:nth-child(1) { animation: eqBounce 0.8s ease-in-out infinite alternate; }
    .playing .eq-bar:nth-child(2) { animation: eqBounce 0.6s ease-in-out infinite 0.2s alternate; }
    .playing .eq-bar:nth-child(3) { animation: eqBounce 0.9s ease-in-out infinite 0.4s alternate; }
    .playing .eq-bar:nth-child(4) { animation: eqBounce 0.7s ease-in-out infinite 0.1s alternate; }
    .playing .eq-bar:nth-child(5) { animation: eqBounce 0.85s ease-in-out infinite 0.3s alternate; }

    @keyframes eqBounce {
      0% { height: 4px; }
      100% { height: 16px; }
    }

    /* Scrubber / Progress Bar */
    .progress-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .scrubber-wrap {
      width: 100%;
      height: 14px;
      display: flex;
      align-items: center;
      cursor: pointer;
      position: relative;
    }

    .scrubber-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 3px;
      position: relative;
      overflow: hidden;
    }

    .scrubber-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #58a6ff, #79b8ff);
      border-radius: 3px;
      transition: width 0.1s linear;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Controls Bar */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 4px;
    }

    .media-buttons {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, transform 0.2s, background 0.2s;
    }

    .btn-icon:hover {
      color: #ffffff;
      transform: scale(1.1);
      background: rgba(255, 255, 255, 0.08);
    }

    .play-btn-large {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--primary);
      color: #0b0b10;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 20px var(--primary-glow), 0 6px 16px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      flex-shrink: 0;
    }

    .play-btn-large:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px rgba(88, 166, 255, 0.8), 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    .play-btn-large:active {
      transform: scale(0.96);
    }

    /* Bottom Action Row (Volume + Open in YT) */
    .bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
    }

    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 90px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.18);
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
    }

    /* Open in YouTube Pill Badge */
    .yt-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ff0000;
      color: #ffffff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 0 4px 14px rgba(255, 0, 0, 0.4);
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .yt-pill-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 0, 0, 0.65);
      background: #e60000;
    }

    .yt-pill-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Playlist Selector Tabs */
    .playlist-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .playlist-heading {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .tracks-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    @media (max-width: 480px) {
      .tracks-grid {
        grid-template-columns: 1fr;
      }
    }

    .track-chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }

    .track-chip:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .track-chip.active {
      background: rgba(88, 166, 255, 0.12);
      border-color: var(--primary);
      box-shadow: 0 0 16px rgba(88, 166, 255, 0.25);
    }

    .chip-thumb {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .chip-text {
      min-width: 0;
      flex: 1;
    }

    .chip-title {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chip-artist {
      font-size: 10.5px;
      color: var(--text-muted);
    }

    /* Hidden YouTube Player IFrame container */
    #yt-player-container {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0.001;
      pointer-events: none;
      left: -9999px;
      bottom: -9999px;
    }
  </style>
</head>
<body>
  <div class="backdrop-glow"></div>

  <div class="container">
    <!-- Top profile link -->
    <div class="top-bar">
      <a href="https://github.com/AadishY" class="profile-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        <span>@AadishY</span>
      </a>
      <span class="pixel-tag">LIVE PLAYER</span>
    </div>

    <!-- Main Player Card -->
    <div class="player-card" id="playerCard">
      <!-- Header with Live badge -->
      <div class="card-header">
        <span>NOW PLAYING</span>
        <div class="live-badge">
          <div class="live-dot"></div>
          <span>LIVE AUDIO</span>
        </div>
      </div>

      <!-- Track Info Row -->
      <div class="track-info-row">
        <div class="artwork-wrap">
          <img id="trackArt" class="artwork-img" src="" alt="Album Artwork" />
        </div>
        <div class="track-meta">
          <div id="trackTitle" class="track-title">Loading track...</div>
          <div id="trackArtist" class="track-artist">Aadish's Playlist</div>
          <!-- Equalizer -->
          <div class="equalizer-bar-group">
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
          </div>
        </div>
      </div>

      <!-- Scrubber Section -->
      <div class="progress-section">
        <div class="scrubber-wrap" id="scrubberWrap">
          <div class="scrubber-track">
            <div class="scrubber-fill" id="scrubberFill"></div>
          </div>
        </div>
        <div class="time-labels">
          <span id="currentTime">0:00</span>
          <span id="totalDuration">0:00</span>
        </div>
      </div>

      <!-- Media Controls Row -->
      <div class="controls-row">
        <div class="media-buttons">
          <!-- Shuffle -->
          <button class="btn-icon" id="btnShuffle" title="Shuffle Track">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 3 21 3 21 8"></polyline>
              <line x1="4" y1="20" x2="21" y2="3"></line>
              <polyline points="21 16 21 21 16 21"></polyline>
              <line x1="15" y1="15" x2="21" y2="21"></line>
              <line x1="4" y1="4" x2="9" y2="9"></line>
            </svg>
          </button>

          <!-- Prev -->
          <button class="btn-icon" id="btnPrev" title="Previous Track">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="19 20 9 12 19 4 19 20"></polygon>
              <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line>
            </svg>
          </button>
        </div>

        <!-- Large Play / Pause Button in front -->
        <button class="play-btn-large" id="btnPlayPause" title="Play / Pause">
          <svg id="iconPlay" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="6 3 20 12 6 21 6 3"></polygon>
          </svg>
          <svg id="iconPause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
            <rect x="6" y="4" width="4" height="16" rx="1.5"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1.5"></rect>
          </svg>
        </button>

        <div class="media-buttons">
          <!-- Next -->
          <button class="btn-icon" id="btnNext" title="Next Track">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 4 15 12 5 20 5 4"></polygon>
              <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Bottom Action Row (Volume + Open in YouTube) -->
      <div class="bottom-row">
        <!-- Volume -->
        <div class="volume-wrap">
          <button class="btn-icon" id="btnMute" style="padding: 4px;" title="Mute / Unmute">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
          </button>
          <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="85" />
        </div>

        <!-- Open in YouTube Pill Button -->
        <a id="btnOpenYT" href="#" target="_blank" class="yt-pill-btn">
          <svg viewBox="0 0 24 24">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
          <span>Open in YT ↗</span>
        </a>
      </div>
    </div>

    <!-- Playlist Selector -->
    <div class="playlist-section">
      <div class="playlist-heading">Featured Tracks</div>
      <div class="tracks-grid" id="tracksGrid"></div>
    </div>
  </div>

  <!-- YouTube IFrame container -->
  <div id="yt-player-container">
    <div id="ytplayer"></div>
  </div>

  <script>
    const tracks = [
      {
        id: "9XHrWGJtO1A",
        url: "https://youtu.be/9XHrWGJtO1A",
        title: "pupsies - Misery. (Sped Up // Subaru Natsuki)",
        artist: "Empty",
        duration: "2:12",
        thumb: "https://i.ytimg.com/vi/9XHrWGJtO1A/hqdefault.jpg"
      },
      {
        id: "hQE7IxvnGQU",
        url: "https://youtu.be/hQE7IxvnGQU",
        title: "Elden Ring: Bayle the Dread (4K Edit)",
        artist: "Universal Clipz",
        duration: "0:27",
        thumb: "https://i.ytimg.com/vi/hQE7IxvnGQU/hqdefault.jpg"
      },
      {
        id: "rFLO6wgvBbk",
        url: "https://youtu.be/rFLO6wgvBbk",
        title: "Maliketh: \"Oh death, become my blade once more\" (Slowed)",
        artist: "EpsilonnEdit",
        duration: "2:05",
        thumb: "https://i.ytimg.com/vi/rFLO6wgvBbk/hqdefault.jpg"
      },
      {
        id: "ufAmIBRFohM",
        url: "https://youtu.be/ufAmIBRFohM",
        title: "Elden Ring: Bayle the Dread (with Igon's Voicelines)",
        artist: "Muvi",
        duration: "3:45",
        thumb: "https://i.ytimg.com/vi/ufAmIBRFohM/hqdefault.jpg"
      }
    ];

    // Determine initial track index from URL query param ?id=
    const params = new URLSearchParams(window.location.search);
    let initialIndex = 0;
    const qId = params.get('id');
    if (qId && !isNaN(qId)) {
      const parsed = parseInt(qId, 10) - 1;
      initialIndex = Math.abs(parsed) % tracks.length;
    } else {
      initialIndex = Math.floor(Math.random() * tracks.length);
    }

    let currentIndex = initialIndex;
    let player = null;
    let isPlaying = false;
    let updateTimer = null;

    // DOM Elements
    const playerCard = document.getElementById('playerCard');
    const trackArt = document.getElementById('trackArt');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const currentTimeEl = document.getElementById('currentTime');
    const totalDurationEl = document.getElementById('totalDuration');
    const scrubberWrap = document.getElementById('scrubberWrap');
    const scrubberFill = document.getElementById('scrubberFill');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const iconPlay = document.getElementById('iconPlay');
    const iconPause = document.getElementById('iconPause');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnShuffle = document.getElementById('btnShuffle');
    const btnMute = document.getElementById('btnMute');
    const volumeSlider = document.getElementById('volumeSlider');
    const btnOpenYT = document.getElementById('btnOpenYT');
    const tracksGrid = document.getElementById('tracksGrid');

    // Populate playlist chips
    function renderPlaylist() {
      tracksGrid.innerHTML = '';
      tracks.forEach((t, i) => {
        const chip = document.createElement('div');
        chip.className = `track-chip ${i === currentIndex ? 'active' : ''}`;
        chip.innerHTML = `
          <img class="chip-thumb" src="${t.thumb}" alt="thumb" />
          <div class="chip-text">
            <div class="chip-title">${t.title}</div>
            <div class="chip-artist">${t.artist} • ${t.duration}</div>
          </div>
        `;
        chip.addEventListener('click', () => switchTrack(i));
        tracksGrid.appendChild(chip);
      });
    }

    function updateTrackUI() {
      const t = tracks[currentIndex];
      trackArt.src = t.thumb;
      trackTitle.textContent = t.title;
      trackArtist.textContent = t.artist;
      totalDurationEl.textContent = t.duration;
      btnOpenYT.href = t.url;
      renderPlaylist();
    }

    // Format seconds to mm:ss
    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function setPlayState(playing) {
      isPlaying = playing;
      if (playing) {
        playerCard.classList.add('playing');
        iconPlay.style.display = 'none';
        iconPause.style.display = 'block';
      } else {
        playerCard.classList.remove('playing');
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
      }
    }

    function switchTrack(index) {
      currentIndex = index;
      updateTrackUI();
      if (player && player.loadVideoById) {
        player.loadVideoById(tracks[currentIndex].id);
        player.playVideo();
      }
    }

    // Scrubber click handler
    scrubberWrap.addEventListener('click', (e) => {
      if (!player || !player.getDuration) return;
      const rect = scrubberWrap.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const ratio = Math.max(0, Math.min(1, clickX / rect.width));
      const dur = player.getDuration();
      if (dur > 0) {
        player.seekTo(dur * ratio, true);
      }
    });

    // Button event listeners
    btnPlayPause.addEventListener('click', () => {
      if (!player) return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    });

    btnPrev.addEventListener('click', () => {
      const newIdx = (currentIndex - 1 + tracks.length) % tracks.length;
      switchTrack(newIdx);
    });

    btnNext.addEventListener('click', () => {
      const newIdx = (currentIndex + 1) % tracks.length;
      switchTrack(newIdx);
    });

    btnShuffle.addEventListener('click', () => {
      let next;
      do {
        next = Math.floor(Math.random() * tracks.length);
      } while (next === currentIndex && tracks.length > 1);
      switchTrack(next);
    });

    volumeSlider.addEventListener('input', (e) => {
      if (player && player.setVolume) {
        player.setVolume(e.target.value);
        if (e.target.value > 0 && player.isMuted()) {
          player.unMute();
        }
      }
    });

    btnMute.addEventListener('click', () => {
      if (!player) return;
      if (player.isMuted()) {
        player.unMute();
        volumeSlider.value = player.getVolume() || 80;
      } else {
        player.mute();
        volumeSlider.value = 0;
      }
    });

    // YouTube IFrame API initialization
    window.onYouTubeIframeAPIReady = function() {
      player = new YT.Player('ytplayer', {
        height: '180',
        width: '320',
        videoId: tracks[currentIndex].id,
        playerVars: {
          autoplay: 1,
          controls: 0,
          disablekb: 1,
          fs: 0,
          rel: 0,
          modestbranding: 1
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange
        }
      });
    };

    function onPlayerReady(event) {
      event.target.setVolume(85);
      event.target.playVideo();
      startProgressTracker();
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        setPlayState(true);
      } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
        setPlayState(false);
        if (event.data === YT.PlayerState.ENDED) {
          // Auto advance to next track
          switchTrack((currentIndex + 1) % tracks.length);
        }
      }
    }

    function startProgressTracker() {
      if (updateTimer) clearInterval(updateTimer);
      updateTimer = setInterval(() => {
        if (player && player.getCurrentTime && player.getDuration) {
          const cur = player.getCurrentTime();
          const dur = player.getDuration();
          if (dur > 0) {
            const pct = (cur / dur) * 100;
            scrubberFill.style.width = `${pct}%`;
            currentTimeEl.textContent = formatTime(cur);
            totalDurationEl.textContent = formatTime(dur);
          }
        }
      }, 250);
    }

    // Load YouTube API script
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    // Initial UI render
    updateTrackUI();
  </script>
</body>
</html>
