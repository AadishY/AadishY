name: Rotate Banner, Quote & Music

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rotate Banner, Quote, and Music Widget
        run: |
          python scripts/rotate.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add banner/current_banner.webp youtube-music-widget.svg README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Rotate banner, quote, and music widget"
            git push
          fi
