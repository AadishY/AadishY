name: Generate YouTube Music Widget

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate YouTube music widget
        uses: daeun503/profile-music-widget@v1
        with:
          playlist_id: "PLrAl_fG9q5P2Y0wYg10pW27GqI7p7s-F_" # Replace with your YouTube playlist ID if you want multiple rotating songs
          theme: "default.svg"

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
